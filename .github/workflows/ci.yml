name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: '跳过代码检查阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_test:
        description: '跳过单元测试阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（actions/checkout, actions/setup-node 等）
  # 解决 "Node.js 20 actions are deprecated" 弃用警告
  # 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # 与 Dockerfile（node:22）、backend engines（>=22.0.0）统一；deepagents 传递依赖 openai@7 要求 node>=22
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # 质量闸门：前端代码检查与构建
  # ============================================================
  frontend:
    name: Frontend / 前端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: frontend
        run: npm test

      # build 含 tsc：类型错误必须在合并前暴露（镜像构建在 release 阶段另跑一次）
      - name: Build / 构建
        working-directory: frontend
        run: npm run build

  # ============================================================
  # 质量闸门：后端代码检查与测试
  # ============================================================
  backend:
    name: Backend / 后端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: backend
        run: npm run lint

      - name: Type Check / 类型检查
        working-directory: backend
        run: npx tsc --noEmit

      # Dockerfile 静态检查放美国 runner（hadolint 无 darwin-arm64 原生版，构建机为 macOS）
      - name: Dockerfile Lint / Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Job Dockerfile Lint / Job Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.job
          failure-threshold: error

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: backend
        run: npm test

  # ============================================================
  # 发布阶段：构建镜像 + 部署（详见 .github/workflows/release.yaml）
  # develop → staging 自动部署；main → production 需 GitHub Environment 人工批准
  # PR 不触发（不推镜像）；workflow_dispatch 在其他分支上只构建镜像、不部署
  # ============================================================
  release:
    name: Release / 构建并部署
    needs: [frontend, backend]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release.yaml
    with:
      deploy: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      deploy_env: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}
      run_migration: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
