    stroke-linejoin="round"
  />

  <!-- 眼睛 -->
  <circle cx="13.2" cy="14.5" r="1.4" fill="#22d3ee" />
  <circle cx="18.8" cy="14.5" r="1.4" fill="#22d3ee" />

  <!-- 月刃装饰 -->
  <path
    d="M8 11c1.8 0.8 3 2.5 3 4.5M24 11c-1.8 0.8-3 2.5-3 4.5"
    fill="none"
    stroke="url(#mgrSilver)"
    stroke-width="1"
