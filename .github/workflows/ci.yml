name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: '跳过代码检查阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_test:
        description: '跳过单元测试阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（actions/checkout, actions/setup-node 等）
  # 解决 "Node.js 20 actions are deprecated" 弃用警告
  # 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # 与 Dockerfile（node:22）、backend engines（>=22.0.0）统一；deepagents 传递依赖 openai@7 要求 node>=22
  NODE_VERSION: '22'
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
  IMAGE_NAME: acore-manager
  IMAGE_NAME_JOB: acore-manager-job

jobs:
  # ============================================================
  # Stage 1: 前端代码检查与构建
  # ============================================================
  frontend:
    name: Frontend / 前端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Generate app version / 生成应用版本号
        id: version
        run: |
          APP_VERSION=$(cat VERSION)
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: frontend
        run: npm test

      - name: Build / 构建
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: npm run build

  # ============================================================
  # Stage 2: 后端代码检查与测试
  # ============================================================
  backend:
    name: Backend / 后端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: backend
        run: npm run lint

      - name: Type Check / 类型检查
        working-directory: backend
        run: npx tsc --noEmit

      # Dockerfile 静态检查放美国 runner（hadolint 无 darwin-arm64 原生版，构建机为 macOS）
      - name: Dockerfile Lint / Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Job Dockerfile Lint / Job Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.job
          failure-threshold: error

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: backend
        run: npm test

      - name: Build / 构建
        working-directory: backend
        run: npm run build

  # ============================================================
  # Stage 3: Docker 镜像构建与推送（app/job 双镜像并行 job，互不拖累；
  # 单镜像失败可 re-run failed jobs 单独重试）
  # 构建机为自托管 runner（Mac，本机直推 TCR 国内链路）；保留首推失败重试兜底，
  # 失败后构建走 buildx 本地缓存秒级重建、立即重推一次；首推 continue-on-error，
  # 结论由 gate 步骤裁定（任一次成功即绿），避免首推失败把 job 判死、Stage 4 被 needs 跳过；
  # provenance 关闭，免除 TCR 不认的 attestation manifest 并减小推送体积
  # ============================================================
  docker-app:
    name: Docker App / App 镜像构建推送
    runs-on: [self-hosted]
    needs: [frontend, backend]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    outputs:
      # 只传不含密钥的片段：TCR 命名空间是 secret，含它的完整镜像地址会被 GitHub 判为含密而丢弃输出
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_digest: ${{ steps.image_info.outputs.image_digest }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Generate image tags / 生成镜像标签
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          APP_VERSION=$(cat VERSION)
          echo "sha_short=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and Push / 构建并推送（第 1 次尝试）
        id: push
        uses: docker/build-push-action@v7
        # 步骤级超时：stall 时 25 分钟强制失败，把剩余预算留给重试
        # continue-on-error：首推失败不直接判死 job，最终结论由 gate 步骤裁定
        continue-on-error: true
        timeout-minutes: 25
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.latest_tag }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}

      - name: Build and Push / 构建并推送（重试）
        if: steps.push.outcome == 'failure'
        id: push-retry
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.latest_tag }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}

      - name: Conclude push outcome / 推送结论裁定
        if: always()
        # 任一次尝试成功即 job 成功；两次皆败才判红（否则首推超时失败会把 job 判死、Stage 4 被 needs 跳过）
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ] || [ "${{ steps.push-retry.outcome }}" = "success" ]; then
            echo "[OK] image push succeeded"
          else
            echo "[FAIL] image push failed in both attempts" >&2
            exit 1
          fi

      - name: Output image info / 输出镜像信息
        id: image_info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.push-retry.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then
            echo "[FAIL] 未取到镜像 digest" >&2
            exit 1
          fi
          echo "image_tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "App image tag: ${BRANCH}-${SHORT_SHA} (${DIGEST})"

  docker-job:
    name: Docker Job / Job 镜像构建推送
    runs-on: [self-hosted]
    needs: [frontend, backend]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    outputs:
      # 同 docker-app：只传不含密钥的片段
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_digest: ${{ steps.image_info.outputs.image_digest }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Generate image tags / 生成镜像标签
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          echo "job_image_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME_JOB }}:${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "job_latest_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME_JOB }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push Job Image / 构建并推送 Job 镜像（第 1 次尝试）
        id: push
        uses: docker/build-push-action@v7
        # 步骤级超时：stall 时 25 分钟强制失败，把剩余预算留给重试
        # continue-on-error：首推失败不直接判死 job，最终结论由 gate 步骤裁定
        continue-on-error: true
        timeout-minutes: 25
        with:
          context: .
          file: docker/Dockerfile.job
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.job_image_tag }}
            ${{ steps.vars.outputs.job_latest_tag }}

      - name: Build and Push Job Image / 构建并推送 Job 镜像（重试）
        if: steps.push.outcome == 'failure'
        id: push-retry
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          file: docker/Dockerfile.job
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.job_image_tag }}
            ${{ steps.vars.outputs.job_latest_tag }}

      - name: Conclude push outcome / 推送结论裁定
        if: always()
        # 任一次尝试成功即 job 成功；两次皆败才判红（否则首推超时失败会把 job 判死、Stage 4 被 needs 跳过）
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ] || [ "${{ steps.push-retry.outcome }}" = "success" ]; then
            echo "[OK] job image push succeeded"
          else
            echo "[FAIL] job image push failed in both attempts" >&2
            exit 1
          fi

      - name: Output image info / 输出镜像信息
        id: image_info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.push-retry.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then
            echo "[FAIL] 未取到 Job 镜像 digest" >&2
            exit 1
          fi
          echo "image_tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Job image tag: ${BRANCH}-${SHORT_SHA} (${DIGEST})"

  # ============================================================
  # Stage 4: Staging SCF 自动部署（仅 develop）
  # 双镜像推送成功后，调用 SCF UpdateFunctionCode 将 Staging
  # Web/Job 函数切换到本次 {分支}-{short_sha}@digest 钉版镜像，
  # 并轮询至 Active 且镜像摘要一致（向 acore-ranking 的部署确证口径看齐）
  # 所需 vars：SCF_STAGING_WEB_FUNCTION（必填）、SCF_STAGING_JOB_FUNCTION
  # （可选，未配置则跳过 Job 函数更新）；凭据 secrets：TENCENT_SECRET_ID/KEY
  # ============================================================
  deploy-staging:
    name: Deploy Staging / Staging SCF 部署
    runs-on: ubuntu-latest
    needs: [docker-app, docker-job]
    # Staging 跟随 develop 分支：push 自动部署；手动 dispatch 也须在 develop 上执行
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    env:
      # region / 命名空间 / 函数名均为非敏感配置，走仓库变量（vars）
      SCF_REGION: ${{ vars.SCF_REGION || 'ap-beijing' }}
      SCF_NAMESPACE: ${{ vars.SCF_STAGING_NAMESPACE || 'staging' }}
      # 条件变量须挂 job 级：步骤 if 读取时步骤自身的 env 块尚未生效
      SCF_WEB_FUNCTION: ${{ vars.SCF_STAGING_WEB_FUNCTION }}
      SCF_JOB_FUNCTION: ${{ vars.SCF_STAGING_JOB_FUNCTION }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Install tccli / 安装腾讯云 CLI
        run: pip3 install --quiet tccli

      - name: Configure tccli / 配置腾讯云凭据
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          # tccli configure set 用位置参数 varname value，不支持 --region/--secretId 旗标
          tccli configure set region "$SCF_REGION" secretId "$TENCENT_SECRET_ID" secretKey "$TENCENT_SECRET_KEY"

      # 镜像地址在此组装：TCR 命名空间是 secret，无法作为 job 输出跨 job 传递；
      # tag@digest 钉版——digest 由构建 job 产出，确保切到的是本次构建的镜像
      - name: Compute image URIs / 组装钉版镜像地址
        id: vars
        env:
          APP_DIGEST: ${{ needs.docker-app.outputs.image_digest }}
          JOB_DIGEST: ${{ needs.docker-job.outputs.image_digest }}
        run: |
          set -euo pipefail
          : "${SCF_WEB_FUNCTION:?vars.SCF_STAGING_WEB_FUNCTION 未配置}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "app_image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:develop-${SHORT_SHA}@${APP_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "job_image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME_JOB}:develop-${SHORT_SHA}@${JOB_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "app_digest=${APP_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "job_digest=${JOB_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "App: develop-${SHORT_SHA}@${APP_DIGEST}"
          echo "Job: develop-${SHORT_SHA}@${JOB_DIGEST}"

      - name: Update Web function / 更新 Staging Web 函数镜像
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ImageConfig":{"ImageType":"personal","ImageUri":"%s","ImagePort":9000}}' '${{ steps.vars.outputs.app_image }}')
          for attempt in 1 2; do
            if tccli scf UpdateFunctionCode \
              --FunctionName "$SCF_WEB_FUNCTION" \
              --Namespace "$SCF_NAMESPACE" \
              --Code "$PAYLOAD" \
              --output json; then
              echo "UpdateFunctionCode accepted (attempt ${attempt})"
              exit 0
            fi
            # 函数可能正处于 Updating 状态（操作冲突），等待后重试一次
            if [ "$attempt" -lt 2 ]; then sleep 45; fi
          done
          echo "UpdateFunctionCode failed after retries" >&2
          exit 1

      - name: Update Job function / 更新 Staging Job 函数镜像（可选）
        if: env.SCF_JOB_FUNCTION != ''
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ImageConfig":{"ImageType":"personal","ImageUri":"%s","ImagePort":-1}}' '${{ steps.vars.outputs.job_image }}')
          for attempt in 1 2; do
            if tccli scf UpdateFunctionCode \
              --FunctionName "$SCF_JOB_FUNCTION" \
              --Namespace "$SCF_NAMESPACE" \
              --Code "$PAYLOAD" \
              --output json; then
              echo "UpdateFunctionCode accepted (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 45; fi
          done
          echo "UpdateFunctionCode failed after retries" >&2
          exit 1

      # Active 且镜像摘要 == 本次 digest 才算部署确证（只等 Active 可能读到旧镜像的就绪态）
      - name: Wait for functions Active / 等待函数更新生效（校验摘要）
        timeout-minutes: 12
        run: |
          set -euo pipefail
          check() {
            local fn="$1" want="$2"
            local status="" uri=""
            # 40 × 15s ≈ 10 分钟：镜像拉取与实例滚动可能较慢
            for i in $(seq 1 40); do
              json=$(tccli scf GetFunction --FunctionName "$fn" --Namespace "$SCF_NAMESPACE" --output json)
              status=$(jq -r '.Status' <<<"$json")
              uri=$(jq -r '.ImageConfig.ImageUri // ""' <<<"$json")
              case "$status" in
                Active)
                  if [[ "$uri" == *"@${want}" ]]; then
                    echo "[OK] $fn is Active on ${want}"
                    return 0
                  fi
                  # Active 但仍是旧镜像：更新尚未滚动完成，继续等
                  ;;
                Updating|Creating)
                  ;;
                *)
                  echo "[FAIL] $fn status: $status" >&2
                  tccli scf GetFunction --FunctionName "$fn" --Namespace "$SCF_NAMESPACE" --output json >&2 || true
                  return 1
                  ;;
              esac
              sleep 15
            done
            echo "[FAIL] timeout waiting for $fn (last: ${status} ${uri})" >&2
            return 1
          }
          sleep 10
          check "$SCF_WEB_FUNCTION" "${{ steps.vars.outputs.app_digest }}"
          if [ -n "$SCF_JOB_FUNCTION" ]; then
            check "$SCF_JOB_FUNCTION" "${{ steps.vars.outputs.job_digest }}"
          fi

      - name: Output deploy info / 输出部署信息
        run: |
          echo "Staging Web function: ${{ vars.SCF_STAGING_WEB_FUNCTION }}"
          echo "App image: ${{ steps.vars.outputs.app_image }}"
          echo "Job image: ${{ steps.vars.outputs.job_image }}"

  # ============================================================
  # Stage 5: 生产 acm 库迁移（仅 main）
  # 双镜像推送成功后，SSH 到生产主机对 acm 库增量应用 docker/database/migrations/
  # 中尚未在 acm_migrations 记账的迁移（单事务：迁移文件 + 记账 INSERT，失败即中止）。
  # 迁移先于云函数切换执行：旧镜像 + 新表是安全的中间态。
  # 需 vars：DEPLOY_HOST（生产主机 user@host）；Secrets：DEPLOY_MIGRATE_SSH_KEY
  # （CI 专用私钥）、DEPLOY_KNOWN_HOSTS（主机指纹，仓库公开不入文件）
  # ============================================================
  deploy-prod-migration:
    name: Prod DB Migration / 生产库迁移
    runs-on: ubuntu-latest
    needs: [docker-app, docker-job]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup SSH key / 配置 CI 专用私钥与主机指纹
        env:
          DEPLOY_MIGRATE_SSH_KEY: ${{ secrets.DEPLOY_MIGRATE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_MIGRATE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Apply pending migrations / 增量应用未执行迁移
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?vars.DEPLOY_HOST 未配置}"
          MIGRATION_DIR=docker/database/migrations
          applied=0
          for file in "$MIGRATION_DIR"/*.sql; do
            name=$(basename "$file")
            # 已记账则跳过（幂等，可重复执行）
            if ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_HOST" \
              "sudo -n -u postgres psql -d acm -tAc \"SELECT 1 FROM acm_migrations WHERE name = '$name'\"" | grep -qx 1; then
              echo "[skip] $name already applied"
              continue
            fi
            echo "[apply] $name"
            scp -o BatchMode=yes -o IdentitiesOnly=yes -q "$file" "$DEPLOY_HOST:/tmp/$name"
            ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_HOST" \
              "sudo -n -u postgres psql -d acm -v ON_ERROR_STOP=1 -1 -f '/tmp/$name' -c \"INSERT INTO acm_migrations (name) VALUES ('$name');\""
            ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_HOST" "rm -f '/tmp/$name'"
            applied=$((applied + 1))
          done
          echo "Applied $applied migration(s)"

      - name: Verify table owners / 验证表 owner
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        # 2026-10-08 生产事故教训：postgres 建表后 acm 角色无权限 → 页面 500；迁移文件已内嵌 OWNER TO，此处留验证输出
        run: |
          : "${DEPLOY_HOST:?vars.DEPLOY_HOST 未配置}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_HOST" \
            "sudo -n -u postgres psql -d acm -c \"SELECT tablename, tableowner FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;\""

  # ============================================================
  # Stage 6: 生产 SCF 自动部署（仅 main，向 acore-ranking 口径看齐）
  # 库迁移（Stage 5）成功后，将生产 Web/Job 函数切换到本次
  # {分支}-{short_sha}@digest 钉版镜像，并轮询至 Active 且摘要一致。
  # 迁移在前、切函数在后：旧镜像 + 新表是安全中间态，反向则新代码可能撞缺表。
  # 所需 vars：SCF_PRODUCTION_NAMESPACE、SCF_PRODUCTION_WEB_FUNCTION（必填）、
  # SCF_PRODUCTION_JOB_FUNCTION（可选，未配置则只更 Web 函数）
  # ============================================================
  deploy-prod-scf:
    name: Deploy Prod SCF / 生产函数部署
    runs-on: ubuntu-latest
    needs: [docker-app, docker-job, deploy-prod-migration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    env:
      SCF_REGION: ${{ vars.SCF_REGION || 'ap-beijing' }}
      # 默认值必须是 production：改错默认值等于把生产包发到测试
      SCF_NAMESPACE: ${{ vars.SCF_PRODUCTION_NAMESPACE || 'production' }}
      SCF_WEB_FUNCTION: ${{ vars.SCF_PRODUCTION_WEB_FUNCTION }}
      SCF_JOB_FUNCTION: ${{ vars.SCF_PRODUCTION_JOB_FUNCTION }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Install tccli / 安装腾讯云 CLI
        run: pip3 install --quiet tccli

      - name: Configure tccli / 配置腾讯云凭据
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          tccli configure set region "$SCF_REGION" secretId "$TENCENT_SECRET_ID" secretKey "$TENCENT_SECRET_KEY"

      - name: Compute image URIs / 组装钉版镜像地址
        id: vars
        env:
          APP_DIGEST: ${{ needs.docker-app.outputs.image_digest }}
          JOB_DIGEST: ${{ needs.docker-job.outputs.image_digest }}
        run: |
          set -euo pipefail
          : "${SCF_WEB_FUNCTION:?vars.SCF_PRODUCTION_WEB_FUNCTION 未配置}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "app_image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:main-${SHORT_SHA}@${APP_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "job_image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME_JOB}:main-${SHORT_SHA}@${JOB_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "app_digest=${APP_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "job_digest=${JOB_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "App: main-${SHORT_SHA}@${APP_DIGEST}"
          echo "Job: main-${SHORT_SHA}@${JOB_DIGEST}"

      - name: Update Web function / 更新生产 Web 函数镜像
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ImageConfig":{"ImageType":"personal","ImageUri":"%s","ImagePort":9000}}' '${{ steps.vars.outputs.app_image }}')
          for attempt in 1 2; do
            if tccli scf UpdateFunctionCode \
              --FunctionName "$SCF_WEB_FUNCTION" \
              --Namespace "$SCF_NAMESPACE" \
              --Code "$PAYLOAD" \
              --output json; then
              echo "UpdateFunctionCode accepted (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 45; fi
          done
          echo "UpdateFunctionCode failed after retries" >&2
          exit 1

      - name: Update Job function / 更新生产 Job 函数镜像（可选）
        if: env.SCF_JOB_FUNCTION != ''
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ImageConfig":{"ImageType":"personal","ImageUri":"%s","ImagePort":-1}}' '${{ steps.vars.outputs.job_image }}')
          for attempt in 1 2; do
            if tccli scf UpdateFunctionCode \
              --FunctionName "$SCF_JOB_FUNCTION" \
              --Namespace "$SCF_NAMESPACE" \
              --Code "$PAYLOAD" \
              --output json; then
              echo "UpdateFunctionCode accepted (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 45; fi
          done
          echo "UpdateFunctionCode failed after retries" >&2
          exit 1

      - name: Wait for functions Active / 等待函数更新生效（校验摘要）
        timeout-minutes: 12
        run: |
          set -euo pipefail
          check() {
            local fn="$1" want="$2"
            local status="" uri=""
            for i in $(seq 1 40); do
              json=$(tccli scf GetFunction --FunctionName "$fn" --Namespace "$SCF_NAMESPACE" --output json)
              status=$(jq -r '.Status' <<<"$json")
              uri=$(jq -r '.ImageConfig.ImageUri // ""' <<<"$json")
              case "$status" in
                Active)
                  if [[ "$uri" == *"@${want}" ]]; then
                    echo "[OK] $fn is Active on ${want}"
                    return 0
                  fi
                  ;;
                Updating|Creating)
                  ;;
                *)
                  echo "[FAIL] $fn status: $status" >&2
                  tccli scf GetFunction --FunctionName "$fn" --Namespace "$SCF_NAMESPACE" --output json >&2 || true
                  return 1
                  ;;
              esac
              sleep 15
            done
            echo "[FAIL] timeout waiting for $fn (last: ${status} ${uri})" >&2
            return 1
          }
          sleep 10
          check "$SCF_WEB_FUNCTION" "${{ steps.vars.outputs.app_digest }}"
          if [ -n "$SCF_JOB_FUNCTION" ]; then
            check "$SCF_JOB_FUNCTION" "${{ steps.vars.outputs.job_digest }}"
          fi

      - name: Output deploy info / 输出部署信息
        run: |
          echo "Production Web function: ${{ vars.SCF_PRODUCTION_WEB_FUNCTION }}"
          echo "App image: ${{ steps.vars.outputs.app_image }}"
          echo "Job image: ${{ steps.vars.outputs.job_image }}"
