    stroke-linejoin="round"
  />

  <!-- 盾牌内圈 -->
  <path
    d="M16 6l7 2.8v6.5c0 4.5-3.2 8.8-7 10-3.8-1.2-7-5.5-7-10V8.8L16 6z"
    fill="none"
    stroke="url(#mgrPurple)"
    stroke-width="1"
    opacity="0.7"
  />

  <!-- 守望者面具 -->
  <path
    d="M11 11h10l-1.5 7.5h-7L11 11z"
